name: twitter-monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitter-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
            # The rendered card mixes English and Chinese, so Pillow needs a CJK font.
      - name: Install CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Poll once
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TARGET_USER: nikgeneburn
        run: python run_once.py

      - name: Persist state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update poll state [skip ci]"
            git push
          fi
